[package]
name = "tree-sitter-jsonnet"
description = "jsonnet and jrsonnet grammar for tree-sitter"
version = "0.0.1"
license = "MIT"
readme = "README.adoc"
keywords = ["incremental", "parsing", "tree-sitter", "jsonnet"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/deltarocks/tree-sitter-jrsonnet"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.10"
